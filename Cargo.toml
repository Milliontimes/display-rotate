[package]
name = "display-rotate"
version = "0.1.0"
edition = "2021"
description = "Windows 显示器方向托盘程序: 右键切 0/90/180/270, 双击横竖屏 toggle, 并用 CCD 拔插做真·重初始化"

[[bin]]
name = "display-rotate"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

# 仅 Windows 用; 限定 features 减少编译时间。
# Win32_Devices_Display = CCD (GetDisplayConfigBufferSizes/QueryDisplayConfig/
# SetDisplayConfig/DisplayConfigGetDeviceInfo) 与 DISPLAYCONFIG_* 结构体。
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Devices_Display",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
